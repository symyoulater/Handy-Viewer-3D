name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          # Errors are repeated as annotations so they show on the run's summary page.
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ' error ' | Select-Object -First 20 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Stage files
        run: cmake --install build --config Release --prefix stage

      - name: Build desktop app
        shell: pwsh
        run: |
          dotnet build app/ThinPlaceVR.App.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o stage 2>&1 | Tee-Object -FilePath app.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path app.log -Pattern ' error ' | Select-Object -First 20 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }
          # WebView2's loader sometimes lands under runtimes\win-x64; the installer expects it beside the exe.
          if (-not (Test-Path stage\WebView2Loader.dll)) { Copy-Item stage\runtimes\win-x64\native\WebView2Loader.dll stage\ }
          Get-ChildItem stage | Select-Object Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DStageDir=..\stage" installer\ThinPlaceVR.iss
          Get-ChildItem installer\Output

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ThinPlaceVR-Setup-${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe

      # Every build of main refreshes the release for the version in the VERSION file.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Thin Place VR ${{ steps.ver.outputs.version }}
          files: installer/Output/*.exe
          prerelease: false
          make_latest: true
