name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Stage files
        run: cmake --install build --config Release --prefix stage

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DStageDir=..\stage" installer\HandyViewer3D.iss
          Get-ChildItem installer\Output

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HandyViewer3D-Setup-${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe

      # Every build of main refreshes the release for the version in the VERSION file.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Handy Viewer 3D ${{ steps.ver.outputs.version }}
          files: installer/Output/*.exe
          prerelease: true
          make_latest: true
